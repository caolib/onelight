name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match $expected"
            exit 1
          fi

      - name: Build
        run: |
          mkdir -p dist
          MINIFY=1 TYPORA_THEMES="$PWD/dist" pnpm build

      - name: Package
        run: |
          cp -r onelight dist/
          cd dist
          zip -r "../onelight-${GITHUB_REF_NAME}.zip" onelight.css onelight-dark.css onelight

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onelight-theme
          path: onelight-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: onelight-*.zip
          generate_release_notes: true
